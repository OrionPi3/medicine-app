server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow";

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }
}